<div
    class="lead-action-panel border-t-[1px] [border-top-style:solid] border-t-[var(--border)] mt-[22px] pt-[22px]"
>
    <h3 class="mx-[0] text-[17px] font-semibold mt-[0] mb-[12px]">Rechazar lead</h3>
    <p class="muted text-[var(--muted)] text-[13px] leading-[1.6] mb-[20px]">
        Selecciona el tipo de rechazo. Si eliges «Otro motivo», describe la razón antes de confirmar.
    </p>
    <app-select-field
        label="Tipo de rechazo"
        fieldId="lead-reject-reason"
        [required]="true"
        [control]="reason"
        [options]="reasons"
    />
    @if (reason.value === '3') {
    <label class="field lead-actions flex flex-col gap-[7px] text-[12px] font-[550] mt-[20px]"
        >Motivo de rechazo <span class="required text-[#b72f40]">*</span
        ><textarea
            class="py-[10px] px-[12px] border-[1px] border-solid border-[#dce3eb] w-full bg-white text-[var(--text)] rounded-[7px] min-h-[41px] [font-family:inherit] text-[13px] font-normal [font-style:inherit] leading-[inherit] [outline:none] resize-y focus:border-[#00a3ff] focus:shadow-[0_0_0_3px_#00a3ff15]"
            rows="3"
            maxlength="500"
            [formControl]="explanation"
            placeholder="Describe el motivo…"
            aria-required="true"
        ></textarea>
    </label>
    } @if (error()) {
    <p
        class="alert warning lead-actions my-[20px] py-[14px] px-[18px] border-[1px] border-solid border-[#f3e6bd] rounded-[8px] flex items-center justify-between gap-[12px] text-[13px] bg-[#fffaec] text-[#8c6818] leading-[1.6]"
        role="alert"
    >
        {{ error() }}
    </p>
    }
    <div
        class="actions end lead-actions flex items-center gap-[10px] flex-wrap justify-end mt-[20px]"
    >
        <button
            type="button"
            class="btn btn-secondary py-[10px] px-[16px] border-[1px] border-solid border-[#dce4ed] inline-flex items-center justify-center gap-[8px] min-h-[40px] rounded-[7px] font-semibold text-[13px] leading-[1.3] no-underline cursor-pointer [transition:background_0.15s] bg-white text-[#46576a] hover:bg-[#f3f7fb] disabled:opacity-[0.45] disabled:cursor-not-allowed"
            [disabled]="store.saving()"
            (click)="cancelled.emit()"
        >
            Volver al detalle</button
        ><button
            type="button"
            class="btn btn-danger py-[10px] px-[16px] border-[1px] border-solid border-[transparent] inline-flex items-center justify-center gap-[8px] min-h-[40px] rounded-[7px] font-semibold text-[13px] leading-[1.3] no-underline cursor-pointer [transition:background_0.15s] bg-[#ba3547] text-white disabled:opacity-[0.45] disabled:cursor-not-allowed"
            [disabled]="store.saving()"
            (click)="save()"
        >
            Confirmar rechazo
        </button>
    </div>
</div>
