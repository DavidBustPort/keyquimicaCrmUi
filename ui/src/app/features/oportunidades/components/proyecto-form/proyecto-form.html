<section class="rounded-xl border border-slate-200 bg-white p-6">
	<h2 class="mb-5 text-lg font-semibold">Registrar proyectos por aplicación</h2>
	@if (error()) {
		<p
			role="alert"
			class="mb-4 text-red-700"
		>
			{{ error() }}
		</p>
	}
	<div class="grid gap-5 sm:grid-cols-3">
		<label class="field"
			>Tipo de venta<select
				[(ngModel)]="tipoVenta"
				(ngModelChange)="dirty.emit(true)"
				[disabled]="saving()"
			>
				<option [ngValue]="1">Instalada</option>
				<option [ngValue]="2">Esporádica</option>
			</select></label
		><label class="field"
			>Área<select
				[(ngModel)]="area"
				(ngModelChange)="changeArea()"
				[disabled]="saving()"
			>
				<option [ngValue]="0">Selecciona un área</option>
				@for (a of areas(); track a.id) {
					<option [ngValue]="a.id">{{ a.name }}</option>
				}
			</select></label
		><label class="field"
			>Solución<select
				[(ngModel)]="solution"
				(ngModelChange)="changeSolution()"
				[disabled]="saving()"
			>
				<option [ngValue]="0">Selecciona una solución</option>
				@for (s of solutions(); track s.id) {
					<option [ngValue]="s.id">{{ s.name }}</option>
				}
			</select></label
		>
	</div>
	@if (loading()) {
		<p
			role="status"
			class="mt-4"
		>
			Cargando catálogo…
		</p>
	}
	<div class="mt-5 space-y-3">
		@for (a of apps(); track a.id) {
			<div class="grid items-end gap-4 rounded-xl border border-slate-200 bg-slate-50 p-5 md:grid-cols-[minmax(0,1fr)_11rem_13rem]">
				<div class="min-w-0 space-y-2">
					<span class="block text-sm text-slate-500">Aplicación</span>
					<label class="flex min-h-11 min-w-0 flex-row items-center gap-3 text-sm font-medium text-slate-800">
						<input
							class="m-0 size-4 min-h-0 w-4 shrink-0 accent-sky-600"
							type="checkbox"
							[(ngModel)]="a.selected"
							[disabled]="!a.activo || saving()"
							(ngModelChange)="dirty.emit(true)"
						/>
						<span class="min-w-0 wrap-break-word">{{ a.name }}</span>
					</label>
				</div>
				<div class="field min-w-0">
					<span>VPT</span>
					<span class="flex h-11 items-center justify-end rounded-lg border border-slate-200 bg-white px-3 text-sm whitespace-nowrap tabular-nums">{{ vpt(a) | currency: 'MXN' : 'symbol-narrow' }}</span>
				</div>
				@if (a.activo) {
					<label class="field flex min-w-0 flex-col gap-2"
						>VPO<input
							type="number"
							step="10"
							min="0"
							[(ngModel)]="a.vpo"
							[disabled]="saving()"
							(ngModelChange)="dirty.emit(true)"
					/></label>
				} @else {
					<span class="flex min-h-11 items-center text-sm text-slate-500">Ya tiene un proyecto activo</span>
				}
			</div>
		}
	</div>
	<div class="mt-6 flex flex-wrap gap-3 border-t border-slate-200 pt-5">
		<button
			class="action-button action-primary"
			[disabled]="saving() || loading()"
			(click)="save(false)"
		>
			Guardar proyectos</button
		><button
			class="action-button action-secondary"
			[disabled]="saving() || loading()"
			(click)="save(true)"
		>
			Guardar y agregar productos
		</button>
	</div>
</section>
