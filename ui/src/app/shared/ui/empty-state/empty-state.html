<div
    class="empty-state py-[40px] px-[20px] text-center text-[var(--muted)]"
    role="status"
>
    <span
        class="text-[36px] text-[#8babc0]"
        aria-hidden="true"
        >⌕</span
    >
    <h3 class="my-[10px] mx-[0] text-[17px] font-semibold text-[var(--text)]">{{ title() }}</h3>
    <p class="text-[13px]">{{ description() }}</p>
</div>
