<div class="multi-field grid gap-2 text-sm">
	<span>{{ label() }}</span>
	<details
		class="relative"
		(keydown.escape)="menu.open = false"
		#menu
	>
		<summary
			class="h-11 cursor-pointer overflow-hidden rounded-[7px] border-[1px] border-solid border-[#dce3eb] bg-white px-[12px] py-[11px] text-[13px] font-normal text-ellipsis whitespace-nowrap focus-visible:[outline:3px_solid_#89bfff] focus-visible:[outline-offset:2px]"
			[attr.aria-label]="label() + ': ' + summary()"
		>
			{{ summary() }}
		</summary>
		<div
			class="choices absolute top-[calc(100%_+_5px)] left-[0] z-[22] max-h-[240px] w-[max-content] max-w-[280px] min-w-[100%] overflow-auto rounded-[8px] border-[1px] border-solid border-[var(--border)] bg-white p-[8px] shadow-[0_10px_30px_#243d5820]"
		>
			<label class="flex cursor-pointer items-center gap-[10px] p-[10px] font-normal hover:bg-[#f2f8ff]"
				><input
					class="accent-[#007fc7]"
					type="checkbox"
					[checked]="all()"
					[disabled]="!options().length"
					(change)="toggleAll()"
				/>Seleccionar todos</label
			>
			@for (option of options(); track option.value) {
				<label class="flex cursor-pointer items-center gap-[10px] p-[10px] font-normal hover:bg-[#f2f8ff]"
					><input
						class="accent-[#007fc7]"
						type="checkbox"
						[checked]="selected().includes(option.value)"
						(change)="toggle(option.value)"
					/>{{ option.label }}</label
				>
			} @empty {
				<p class="p-[12px] text-[var(--muted)]">Sin opciones disponibles</p>
			}
		</div>
	</details>
</div>
