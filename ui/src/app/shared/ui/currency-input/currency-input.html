<app-form-field
    [label]="label()"
    [forId]="fieldId()"
    [required]="true"
    [error]="error()"
    ><div
        class="currency-control py-[0] px-[12px] border-[1px] border-solid border-[#dce3eb] flex items-center rounded-[7px] gap-[8px] focus-within:[outline:2px_solid_#00a3ff40]"
    >
        <span
            class="text-[var(--muted)] text-[12px]"
            aria-hidden="true"
            >$</span
        ><input
            class="border-[0] [padding-inline:0]"
            type="number"
            min="0.01"
            step="0.01"
            inputmode="decimal"
            [id]="fieldId()"
            [formControl]="control()"
            aria-required="true"
            [attr.aria-invalid]="!!error()"
            [attr.aria-describedby]="error() ? fieldId() + '-error' : null"
        /><span class="text-[var(--muted)] text-[12px]">MXN</span>
    </div></app-form-field
>
