<app-form-field
	[label]="label()"
	[forId]="fieldId()"
	[required]="true"
	[error]="error()"
	><div class="currency-control flex items-center gap-[8px] rounded-[7px] border-[1px] border-solid border-[#dce3eb] px-[12px] py-[0] focus-within:[outline:2px_solid_#00a3ff40]">
		<span
			class="text-[12px] text-[var(--muted)]"
			aria-hidden="true"
			>$</span
		><input
			class="border-[0] [padding-inline:0]"
			type="number"
			min="0.01"
			step="10"
			inputmode="decimal"
			[id]="fieldId()"
			[formControl]="control()"
			aria-required="true"
			[attr.aria-invalid]="!!error()"
			[attr.aria-describedby]="error() ? fieldId() + '-error' : null"
		/><span class="text-[12px] text-[var(--muted)]">MXN</span>
	</div></app-form-field
>
